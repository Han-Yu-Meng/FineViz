info:
  api_port: "4000"

visualize:
  cloud_registered:
    topic: "/cloud_registered"
    type: "sensor_msgs/msg/PointCloud2"
    frame: "map"
    listen_updates: true
    last_time: 0.5
    point_size: 2.5
    color_field: "intensity"
    color_scheme: "turbo"
    alpha: 1.0

  global_map:
    topic: "/global_map"
    type: "sensor_msgs/msg/PointCloud2"
    frame: "map"
    listen_updates: false
    last_time: 0
    point_size: 1
    color_field: "z"
    color_scheme: "warm"
    alpha: 1.0

  plan:
    topic: "/plan"
    type: "nav_msgs/msg/Path"
    frame: "map"
    listen_updates: true
    width: 1.0
    color: "#5D99E3"
    alpha: 0.9

  #trajectories:
  #  topic: "/trajectories"
  #  type: "visualization_msgs/msg/MarkerArray"
  #  alpha: 0.8

  projected_map:
    topic: "/projected_map"
    type: "nav_msgs/msg/OccupancyGrid"
    frame: "map"
    alpha: 0.5
    color_scheme: "gray"
    draw_behind: true

  # ocotomap:
  #   topic: "/occupied_cells_vis_array"
  #   type: "visualization_msgs/msg/MarkerArray"
  #   alpha: 1.0

service:
  Navigation:
    prefix: "/navigation"
    icon: "Activity"

  Speed:
    prefix: "/speed"
    icon: "Gauge"

chart:
  chart1:
    - topic: "/cmd_vel"
      fields: ["linear.x", "angular.z"]
      colors: ["#E35D97", "#5DCEE3"]

  chart2:
    - topic: "/Odometry"
      fields: ["twist.twist.linear.x", "twist.twist.angular.z"]
      colors: ["#E35D97", "#5DE35D"]

pose:
  topic: "/Odometry"
  type: "nav_msgs/msg/Odometry"

robot:
  urdf: "fins/fins.urdf"
  base_frame: "base_link"

control:
  max_linear_speed: 0.5
  max_angular_speed: 1.0
  max_pose_range: 2.0
  publish_rate: 50
