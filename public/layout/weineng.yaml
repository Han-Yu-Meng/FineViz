info:
  api_port: "4000"

visualize:
  cloud_registered:
    topic: "/cloud_registered_body"
    type: "sensor_msgs/msg/PointCloud2"
    frame: "base_link"
    listen_updates: true
    last_time: 0.5
    point_size: 2.5
    color_field: "intensity"
    color_scheme: "turbo"
    alpha: 1.0

  global_map:
    topic: "/global_map_viz"
    type: "sensor_msgs/msg/PointCloud2"
    frame: "map"
    listen_updates: false
    last_time: 0
    point_size: 1
    color_field: "z"
    color_scheme: "warm"
    alpha: 1.0

  plan:
    topic: "/plan"
    type: "nav_msgs/msg/Path"
    frame: "map"
    listen_updates: true
    width: 0.8
    color: "#5D99E3"
    alpha: 0.9

  mppi_path:
    topic: "/astar_path"
    type: "nav_msgs/msg/Path"
    frame: "map"
    listen_updates: true
    width: 0.8
    color: "#5D99E3"
    alpha: 0.9

  geojson:
    topic: "/geojson"
    type: "std_msgs/String"
    frame: "map"

  map:  #TODO: 消耗资源太多，需要优化
    topic: "/map"
    type: "nav_msgs/msg/OccupancyGrid"
    frame: "map"
    alpha: 0.5
    color_scheme: "gray"
    draw_behind: true

  passability_map:
    topic: "/passability_map"
    type: "sensor_msgs/msg/PointCloud2"
    frame: "map"
    listen_updates: true
    last_time: 0.0
    point_size: 2.5
    color_field: "rgb"
    alpha: 1.0


service:
  Navigation:
    prefix: "/navigation"
    icon: "Activity"

chart:
  chart1:
    - topic: "/cmd_vel"
      type: "geometry_msgs/msg/Twist"
      fields: ["linear.x", "angular.z"]
      colors: ["#E35D97", "#5DCEE3"]

  chart2:
    - topic: "/Odometry"
      type: "nav_msgs/msg/Odometry"
      fields: ["twist.twist.linear.x", "twist.twist.angular.z"]
      colors: ["#E35D97", "#5DE35D"]

pose:
  topic: "/localization_pose"
  type: "geometry_msgs/msg/PoseStamped"

control:
  max_linear_speed: 0.5
  max_angular_speed: 1.0
  max_pose_range: 2.0
  publish_rate: 50
