info:
  api_port: "4000"

visualize:
  cloud_registered:
    topic: "/cloud_registered"
    type: "sensor_msgs/msg/PointCloud2"
    listen_updates: true
    last_time: 0.5
    point_size: 2.5
    color_field: "intensity"
    color_scheme: "turbo"
    alpha: 1.0
    
  global_map:
    topic: "/global_map_viz"
    type: "sensor_msgs/msg/PointCloud2"
    listen_updates: false
    last_time: 0
    point_size: 1
    color_field: "z"
    color_scheme: "warm"
    alpha: 1.0
  
  plan:
    topic: "/plan"
    type: "nav_msgs/msg/Path"
    listen_updates: true
    width: 0.8
    color: "#5D99E3"
    alpha: 0.9

  mppi_path:
    topic: "/mppi_path"
    type: "nav_msgs/msg/Path"
    listen_updates: true
    width: 0.8
    color: "#5D99E3"
    alpha: 0.9
  
  # trajectories:
  #   topic: "/trajectories"
  #   type: "visualization_msgs/msg/MarkerArray"
  #   alpha: 0.8

  geojson:
    topic: "/geojson"
    type: "std_msgs/String"

  speed_limit_markers:
    topic: "/speed_limit_markers"
    type: "visualization_msgs/msg/MarkerArray"
    alpha: 1.0

  map:  #TODO: 消耗资源太多，需要优化
    topic: "/map"
    type: "nav_msgs/msg/OccupancyGrid"
    alpha: 0.5
    color_scheme: "gray"
    draw_behind: true

  passability_map:
    topic: "/passability_map"
    type: "sensor_msgs/msg/PointCloud2"
    listen_updates: true
    last_time: 0.0
    point_size: 2.5
    color_field: "rgb"
    alpha: 1.0

 
service:
  Navigation:
    prefix: "/navigation"
    icon: "Activity"
    
status:
  NavigationStatus:
    topic: "/navigation_state"
    type: "std_msgs/msg/String"
    states:
      - state_name: "IDLE"
        icon: "Circle"
        msg: "空闲状态"
      - state_name: "NAVIGATING"
        icon: "Navigation"
        msg: "正在导航中..."
      - state_name: "GOAL_REACHED"
        icon: "CircleCheck"
        msg: "已到达目标点"
      - state_name: "MPPI_OBSTACLE_BLOCKED"
        icon: "AlertTriangle"
        msg: "MPPI 检测到障碍物遮挡"

log:
  rosout:
    topic: "/rosout"
    type: "rcl_interfaces/msg/Log"
    ignore_nodes:
      - "foxglove_bridge"

chart:
  chart1:
    - topic: "/cmd_vel"
      type: "geometry_msgs/msg/Twist"
      fields: ["linear.x", "angular.z"]
      colors: ["#E35D97", "#5DCEE3"]

  chart2:
    - topic: "/Odometry"
      type: "nav_msgs/msg/Odometry"
      fields: ["twist.twist.linear.x", "twist.twist.angular.z"]
      colors: ["#E35D97", "#5DE35D"]
      
tf: 
  axis_length: 0.2
  axis_width: 0.05
  axis_label_visualize: false

robot:
  urdf: "wheelchair/wheelchair.urdf"

control:
  max_linear_speed: 0.5
  max_angular_speed: 1.0
  max_pose_range: 2.0
  publish_rate: 50
