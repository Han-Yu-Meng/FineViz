info:
  api_port: "4000"

visualize:
  cloud_registered:
    topic: "/cloud_registered"
    type: "sensor_msgs/msg/PointCloud2"
    listen_updates: true
    last_time: 0.5
    point_size: 0.5
    color_field: "intensity"
    color_scheme: "turbo"
    alpha: 1.0
    
  global_map:
    topic: "/global_map_viz"
    type: "sensor_msgs/msg/PointCloud2"
    listen_updates: false
    last_time: 0
    point_size: 0.5
    color_field: "z"
    color_scheme: "warm"
    alpha: 1.0
  
  plan:
    topic: "/plan"
    type: "nav_msgs/msg/Path"
    listen_updates: true
    width: 0.8
    color: "#5D99E3"
    alpha: 0.9
  
  # trajectories:
  #   topic: "/trajectories"
  #   type: "visualization_msgs/msg/MarkerArray"
  #   alpha: 0.8

  geojson:
    topic: "/geojson"
    type: "std_msgs/String"

  # map:  #TODO: 消耗资源太多，需要优化
  #   topic: "/map"
  #   type: "nav_msgs/msg/OccupancyGrid"
  #   alpha: 0.5
  #   color_scheme: "gray"
  #   draw_behind: true

 
service:
  Navigation:
    prefix: "/navigation"
    icon: "Activity"
    
chart:
  chart1:
    - topic: "/cmd_vel"
      type: "geometry_msgs/msg/Twist"
      fields: ["linear.x", "angular.z"]
      colors: ["#E35D97", "#5DCEE3"]

  chart2:
    - topic: "/Odometry"
      type: "nav_msgs/msg/Odometry"
      fields: ["twist.twist.linear.x", "twist.twist.angular.z"]
      colors: ["#E35D97", "#5DE35D"]
      
tf: 
  axis_length: 0.2
  axis_width: 0.05
  axis_label_visualize: true

robot:
  urdf: "wheelchair/wheelchair.urdf"

control:
  max_linear_speed: 0.5
  max_angular_speed: 1.0
  max_pose_range: 2.0
  publish_rate: 50
